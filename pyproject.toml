# -----------------------------------------------------------------------------
# 项目基础信息
# -----------------------------------------------------------------------------
[project]
# 项目名称，也是包发布时使用的名称。
# 注意：发布名可以使用短横线，但 Python import 包名通常使用下划线。
name = "forgecli"
# 项目版本号。遵循语义化版本: MAJOR.MINOR.PATCH。
version = "0.0.1"
# 项目描述。
description = "支持长任务的 code-cli"

# 作者信息。
# PEP 621 要求 authors 是对象数组。
authors = [
    { name = "weixiao", email = "lamp.cyan@gmail.com" }
]

# README 文件路径。
# 打包或发布时会作为项目长描述使用。
readme = "README.md"

# 项目要求的 Python 版本。
requires-python = ">=3.13,<4.0"

# 运行时依赖。
# 这里填写项目运行时必须依赖的包。
# 例如：
# dependencies = [
#     "click>=8.1,<9.0",
#     "rich>=13.0,<14.0",
# ]
dependencies = [
    "typer (>=0.26.7,<0.27.0)",
    "rich (>=15.0.0,<16.0.0)",
    "httpx (>=0.28,<0.29)",
    "fastapi (>=0.135,<0.136)",
    "uvicorn (>=0.41,<0.42)",
    "jinja2 (>=3.1,<4.0)",
    # 源码直接 import 了它们, 所以它们必须直接写在这里 —— 而不是靠 fastapi 顺手带进来.
    # 传递依赖是别人的实现细节: fastapi 哪天把 starlette 换成别的, 我们的 import 就在
    # 升级那一刻断掉, 而 pyproject 上一个字都没改. scripts/check_deps.py 守这条 (ADR-0040 决策 11).
    "pydantic (>=2.13,<3.0)",
    "starlette (>=1.6,<2.0)",
    "wcmatch (>=11.0.1,<12.0.0)",
    "charset-normalizer (>=3.5.1,<4.0.0)",
    "regex (>=2026.7.19,<2027.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    # tree-sitter 本体不在这里: 源码只 import language-pack, 由 pack 声明 tree-sitter>=0.23.
    # 我们再钉一个 <0.27 就是在替 pack 决定它能配哪个版本的运行时, 而我们并不知道.
    "tree-sitter-language-pack (>=1.15.8,<2.0.0)",
    "pygit2 (>=1.20.0,<2.0.0)",
    "filelock (>=3.20,<4.0)",
    "sse-starlette (>=3.1,<4.0)",
]

# -----------------------------------------------------------------------------
# 命令行入口
# -----------------------------------------------------------------------------
[project.scripts]
# 安装后会生成 forge 命令。
# 执行 forge 时，会调用 forgecli.interfaces.cli.app 模块中的 main 函数。
forge = "forgecli.interfaces.app:main"

# -----------------------------------------------------------------------------
# Poetry 专用配置
# -----------------------------------------------------------------------------
[tool.poetry]
# 指定源码包位置。
packages = [
    { include = "forgecli", from = "src" },
]
include = [
    { path = "src/forgecli/interfaces/web/static", format = ["wheel", "sdist"] },
    # 系统提示词模板 (ADR-0039). 它们是包内数据: 少了任何一份, 装出来的 forge 起不了
    # 会话, 而源码树里照样跑得起来 —— 打包清单漏了它不会有任何东西报错.
    { path = "src/forgecli/application/prompt/templates", format = ["wheel", "sdist"] },
]

# -----------------------------------------------------------------------------
# 开发依赖
# -----------------------------------------------------------------------------
[tool.poetry.group.dev.dependencies]
# Linter + Formatter。
ruff = "^0.8.0"

# 静态类型检查。
mypy = "^1.0.0"
types-jsonschema = "^4.26.0.20260518"
types-regex = "^2026.7.19.20260720"

# 测试。
pytest = "^8.0.0"

# -----------------------------------------------------------------------------
# pytest 配置
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" 这一条是 `from support.fakes import ...` 能工作的原因: 共享的测试替身住在
# tests/support/, 不是一个已安装的包。
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# -----------------------------------------------------------------------------
# Ruff 基础配置
# -----------------------------------------------------------------------------
[tool.ruff]
# 目标 Python 版本。
target-version = "py313"

# 单行最大长度。
line-length = 88

# Ruff 检查的源码目录。
src = ["src", "tests"]

# -----------------------------------------------------------------------------
# Ruff lint 规则配置
# -----------------------------------------------------------------------------
[tool.ruff.lint]
# 启用的规则集合：
# E    pycodestyle 错误
# F    pyflakes，检查未定义变量、未使用 import 等
# I    import 排序
# B    flake8-bugbear，检查常见 bug 风险
# UP   pyupgrade，提示可使用的新语法
# SIM  flake8-simplify，提示可简化代码
select = ["E", "F", "I", "B", "UP", "SIM"]

# 如果需要忽略某些规则，可以添加：
# ignore = ["E501"]

# -----------------------------------------------------------------------------
# mypy 类型检查配置
# -----------------------------------------------------------------------------
[tool.mypy]
# Python 版本。
python_version = "3.13"

# 让 mypy 从 src 目录寻找源码包。
mypy_path = "src"

# 指定默认检查的包。
# 这样可以直接执行: poetry run mypy
packages = ["forgecli"]

# 启用严格模式。
strict = true

# 发现无效或未生效的配置时给出警告。
warn_unused_configs = true

# 显示 mypy 错误代码，便于精确忽略或搜索问题。
show_error_codes = true

# -----------------------------------------------------------------------------
# 构建系统
# -----------------------------------------------------------------------------
[build-system]
# 使用 poetry-core 作为构建后端。
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
