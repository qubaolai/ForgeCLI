# -----------------------------------------------------------------------------
# 项目基础信息
# -----------------------------------------------------------------------------
[project]
# 项目名称，也是包发布时使用的名称。
# 注意：发布名可以使用短横线，但 Python import 包名通常使用下划线。
name = "forgecli"

# 项目版本号。遵循语义化版本: MAJOR.MINOR.PATCH。
version = "0.1.0"

# 项目描述。
description = "支持长任务的 code-cli"

# 作者信息。
# PEP 621 要求 authors 是对象数组。
authors = [
    { name = "weixiao", email = "lamp.cyan@gmail.com" }
]

# README 文件路径。
# 打包或发布时会作为项目长描述使用。
readme = "README.md"

# 项目要求的 Python 版本。
requires-python = ">=3.13,<4.0"

# 运行时依赖。
# 这里填写项目运行时必须依赖的包。
# 例如：
# dependencies = [
#     "click>=8.1,<9.0",
#     "rich>=13.0,<14.0",
# ]
dependencies = []

# -----------------------------------------------------------------------------
# 命令行入口
# -----------------------------------------------------------------------------
[project.scripts]
# 安装后会生成 forge 命令。
# 执行 forge 时，会调用 forgecli.interfaces.cli.app 模块中的 main 函数。
forge = "forgecli.interfaces.cli.app:main"

# -----------------------------------------------------------------------------
# Poetry 专用配置
# -----------------------------------------------------------------------------
[tool.poetry]
# 指定源码包位置。
packages = [
    { include = "forgecli", from = "src" },
]

# -----------------------------------------------------------------------------
# 开发依赖
# -----------------------------------------------------------------------------
[tool.poetry.group.dev.dependencies]
# 测试框架。
pytest = "^8.0.0"

# Linter + Formatter。
ruff = "^0.8.0"

# 静态类型检查。
mypy = "^1.0.0"

# -----------------------------------------------------------------------------
# pytest 配置
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
# 指定测试目录。
testpaths = ["tests"]

# 将 src 加入 Python 模块搜索路径，便于测试时导入 forgecli。
pythonpath = ["src"]

# pytest 默认参数。
# -ra               显示 skipped / xfailed / failed 等额外摘要
# --strict-markers  使用未注册 marker 时直接报错
# --strict-config   pytest 配置有误时直接报错
addopts = ["-ra", "--strict-markers", "--strict-config"]

# -----------------------------------------------------------------------------
# Ruff 基础配置
# -----------------------------------------------------------------------------
[tool.ruff]
# 目标 Python 版本。
target-version = "py313"

# 单行最大长度。
line-length = 88

# Ruff 检查的源码目录。
src = ["src", "tests"]

# -----------------------------------------------------------------------------
# Ruff lint 规则配置
# -----------------------------------------------------------------------------
[tool.ruff.lint]
# 启用的规则集合：
# E    pycodestyle 错误
# F    pyflakes，检查未定义变量、未使用 import 等
# I    import 排序
# B    flake8-bugbear，检查常见 bug 风险
# UP   pyupgrade，提示可使用的新语法
# SIM  flake8-simplify，提示可简化代码
select = ["E", "F", "I", "B", "UP", "SIM"]

# 如果需要忽略某些规则，可以添加：
# ignore = ["E501"]

# -----------------------------------------------------------------------------
# mypy 类型检查配置
# -----------------------------------------------------------------------------
[tool.mypy]
# Python 版本。
python_version = "3.13"

# 让 mypy 从 src 目录寻找源码包。
mypy_path = "src"

# 指定默认检查的包。
# 这样可以直接执行: poetry run mypy
packages = ["forgecli"]

# 启用严格模式。
strict = true

# 发现无效或未生效的配置时给出警告。
warn_unused_configs = true

# 显示 mypy 错误代码，便于精确忽略或搜索问题。
show_error_codes = true

# -----------------------------------------------------------------------------
# 构建系统
# -----------------------------------------------------------------------------
[build-system]
# 使用 poetry-core 作为构建后端。
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"